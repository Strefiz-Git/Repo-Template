name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Branch name convention (PRs only; bots such as Dependabot are exempt).
      - name: Validate branch name
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        env:
          HEAD_REF: ${{ github.head_ref }} # passed via env: never interpolate untrusted input into `run`
        run: bash scripts/branch.sh --check "$HEAD_REF"

      # TODO(bootstrap): set up your stack BEFORE the check, e.g.
      # - uses: actions/setup-python@v5
      #   with: { python-version: "3.12", cache: pip }
      # - run: pip install -r requirements.txt
      # - uses: actions/setup-node@v4
      #   with: { node-version: 22, cache: npm }
      # - run: npm ci

      - name: Full verification
        run: bash scripts/check.sh
